name: Generate graphs once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tirohan
          outputs: |
            dist/snake.svg?color_snake=22D3EE&color_dots=#0B0F18,#0E3A4A,#155E75,#22D3EE,#A5F3FC
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: tirohan
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: bg_color=0B0F18&color=8FA9C2&line=22D3EE&point=60A5FA&area=true&hide_border=false&border_color=1F3347&title_color=22D3EE&custom_title=Contribution%20Signal

      - name: Commit graphs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update snake contributions
          file_pattern: dist/*.svg
